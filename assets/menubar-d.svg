<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <!-- D = A2 sobre el squircle del app icon. El fondo NO es negro puro: son los
       tonos muestreados del icono real (#22212A arriba → #13121B abajo), para
       que la barra y el Dock se lean como la misma pieza. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22212A"/>
      <stop offset="1" stop-color="#13121B"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="34" height="34" rx="8.5" fill="url(#bg)"/>
  <g transform="translate(4.7,4.7) scale(0.74)">
    <path d="M 15.5 21.5 Q 20 19 22.5 14.5" fill="none" stroke="#ff9101"
          stroke-width="2.9" stroke-linecap="round"/>
    <circle cx="11" cy="25" r="6" fill="none" stroke="#8C27F1" stroke-width="3.4"/>
    <circle cx="25.5" cy="11" r="4.8" fill="#ff9101"/>
  </g>
</svg>
